# DiscordDam edge proxy — mounted as the whole /etc/nginx/nginx.conf.
#
# DEV BOOTSTRAP: nginx refuses to start without TLS certs. One-time:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout infra/nginx/certs/privkey.pem -out infra/nginx/certs/fullchain.pem \
#     -subj "/CN=localhost"
#
# /internal/* is NEVER proxied here — bot⇄auth contract traffic stays on the
# internal compose network only.

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain application/json;

    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/m;

    # Docker's embedded DNS — lets /api resolve new-api lazily at request
    # time so the stack boots without the new-api container present.
    resolver 127.0.0.11 valid=30s;

    upstream auth_server {
        # Compose service name, NOT localhost — in a container, localhost
        # is nginx itself.
        server auth-server:3001;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # burst needed: the OAuth handshake fires 3 rapid legit requests,
        # a bare 10r/m limit 503s the flow.
        location /auth/ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://auth_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Token refresh/revoke ride the same origin (same-origin architecture).
        location /token/ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://auth_server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Existing new-api site. Deferred DNS: nginx starts even when the
        # new-api container is down or absent.
        # Adjust port to your new-api container; it must join this
        # compose project's default network to be resolvable.
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            set $newapi http://new-api:5000;
            proxy_pass $newapi;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}