name: ci

on:
  pull_request:
    branches: [main, develop]

# New push to a PR kills its stale runs; main is untouched (PR-triggered only).
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # pr-summary comment upsert

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      # checkout v4.2.2 — SHA shown in pin table below
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # pnpm must exist BEFORE setup-node, or `cache: pnpm` fails to locate it
      - run: npm install -g pnpm
      - uses: actions/setup-node@v4 # PIN
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  unit-tests:
    # No `needs:` — 13-P: fan-in only at pr-summary; everything parallel.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one package's failure shouldn't hide the others
      matrix:
        workspace: [shared, auth-server, bot, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npm install -g pnpm
      - uses: actions/setup-node@v4 # PIN
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Path filter works regardless of package names.
      # --if-present: legs without a unit suite pass trivially (13-P).
      - run: pnpm --filter ./packages/${{ matrix.workspace }} run test:unit --if-present -- --coverage
      - uses: codecov/codecov-action@v4 # PIN
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # NOTE: no `threshold` input exists — the 70% floor belongs in codecov.yml,
          # not here. See deviations.

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: discordgate_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]   # required — without this localhost is unreachable
        options: >-
          --health-cmd "pg_isready -U testuser -d discordgate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5
    env:
      # Spec used *_TEST suffixed names — the zod config reads these exact
      # names at import time and would crash on the suffixed ones.
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/discordgate_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npm install -g pnpm
      - uses: actions/setup-node@v4 # PIN
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/auth-server run db:migrate --if-present
      - run: pnpm --filter ./packages/auth-server run test:integration --if-present

  docker-build-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [bot, auth-server]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@v3 # PIN
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v5 # PIN
        with:
          context: .
          file: packages/${{ matrix.image }}/Dockerfile
          push: false
          # load:true — without this the image never reaches the local
          # daemon (buildx container driver) and Trivy would have nothing to scan.
          load: true
          tags: discordgate-${{ matrix.image }}:ci
          cache-from: type=gha,scope=discordgate-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=discordgate-${{ matrix.image }}
      # Trivy image scan lives IN THIS JOB — a separate job gets a fresh
      # runner and the loaded image would be gone (spec had this cross-job; broken).
      - name: Trivy scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@0.28.0 # PIN
        with:
          image-ref: discordgate-${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npm install -g pnpm
      - uses: actions/setup-node@v4 # PIN
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      # Dependency- and config-level issues; image CVEs are covered in the
      # build job above (same-runner constraint).
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0 # PIN
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  pr-summary:
    needs: [lint-and-type-check, unit-tests, integration-tests, docker-build-validation, security-scan]
    if: always()
    runs-on: ubuntu-latest
    env:
      LINT: ${{ needs.lint-and-type-check.result }}
      UNIT: ${{ needs.unit-tests.result }}
      INTEG: ${{ needs.integration-tests.result }}
      DOCKER: ${{ needs.docker-build-validation.result }}
      SEC: ${{ needs.security-scan.result }}
    steps:
      - uses: actions/github-script@v7 # PIN
        with:
          script: |
            const emoji = r => r === 'success' ? '✅' : (r === 'skipped' ? '⏭️' : '❌');
            const body = [
              '<!-- ci-summary -->',
              '### CI summary',
              '| check | result |',
              '|---|---|',
              `| lint & typecheck | ${emoji(process.env.LINT)} ${process.env.LINT} |`,
              `| unit tests | ${emoji(process.env.UNIT)} ${process.env.UNIT} |`,
              `| integration tests | ${emoji(process.env.INTEG)} ${process.env.INTEG} |`,
              `| docker build + image scan | ${emoji(process.env.DOCKER)} ${process.env.DOCKER} |`,
              `| security scan | ${emoji(process.env.SEC)} ${process.env.SEC} |`,
              `\n[run details](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
            ].join('\n');
            // Upsert: edit the existing summary comment instead of spamming.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('<!-- ci-summary -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }